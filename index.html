<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="RoboMaster 多视角直播监看工具">
    <title>RoboMaster Spectator Console</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="github-corner" href="https://github.com" target="_blank" rel="noreferrer" aria-label="前往 GitHub 仓库">
      <i data-lucide="github" aria-hidden="true"></i>
      <span>GitHub</span>
    </a>
    <header class="app-header">
      <div>
        <p class="eyebrow">RoboMaster Spectator Console</p>
        <h1 id="eventTitle">赛事多视角监看系统</h1>
      </div>
      <div class="header-actions">
        <span class="version-pill">v1.2.0</span>
        <div class="status-pill" id="feedStatus" aria-live="polite">
          <span class="status-dot"></span>
          <span>准备加载</span>
        </div>
        <button class="icon-button text-button" id="refreshButton" type="button">
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="control-band" aria-label="直播控制">
        <label class="field">
          <span>赛区</span>
          <select id="zoneSelect"></select>
        </label>
        <label class="field search-field">
          <span>筛选视角</span>
          <input id="viewFilter" type="search" placeholder="英雄、工程、无人机、主视角">
        </label>
        <label class="field">
          <span>布局</span>
          <select id="layoutSelect"></select>
        </label>
        <label class="field">
          <span>大画面分辨率</span>
          <select id="mainResolutionSelect"></select>
        </label>
        <div class="meta-row">
          <span id="lastUpdated">尚未更新</span>
          <span id="sourceCount">0 路信号</span>
        </div>
      </section>

      <section class="viewer-layout" id="viewerLayout">
        <article class="main-view" aria-label="主观看视角">
          <div class="video-frame main-frame">
            <video id="mainVideo" class="main-video" controls autoplay muted playsinline></video>
            <div class="video-overlay">
              <div>
                <p id="mainZone" class="video-kicker">赛区</p>
                <h2 id="mainTitle">等待直播源</h2>
              </div>
              <div class="overlay-actions">
                <span id="mainQuality" class="quality-badge">--</span>
                <button class="icon-button" id="muteButton" type="button" aria-label="切换静音">
                  <i data-lucide="volume-x" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <div id="mainError" class="video-error" hidden>
              <p>当前视角加载失败。</p>
              <button class="text-button" id="retryMainButton" type="button">重试</button>
            </div>
          </div>
        </article>

        <aside class="side-panel" aria-label="视角列表">
          <div class="panel-heading">
            <h2>可切换视角</h2>
            <span>小窗优先低清</span>
          </div>
          <div id="thumbGrid" class="thumb-grid"></div>
          <div id="emptyState" class="empty-state" hidden>
            <i data-lucide="radio" aria-hidden="true"></i>
            <p>当前赛区还没有可用第一视角。</p>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
