<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="RoboMaster 多视角直播监看工具">
    <title>RoboMaster Spectator Console</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./app.js?v=1.4.0" defer></script>
  </head>
  <body>
    <a class="github-corner" href="https://github.com/ZhichuCen/RMSpectatorMode" target="_blank" rel="noreferrer" aria-label="前往 GitHub 仓库">
      <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true" focusable="false">
        <path class="octo-bg" d="M0 0l115 115h15l12 27 108 108V0Z"/>
        <path class="octo-arm" d="M128.3 109C113.8 99.7 119 89.6 119 89.6c3-6.9 1.5-11 1.5-11-1.3-6.6 2.9-2.3 2.9-2.3 3.9 4.6 2.1 11 2.1 11-2.6 10.3 5.1 14.6 8.9 15.9"/>
        <path class="octo-body" d="M115 115c-.1.1 3.7 1.5 4.8.4l13.9-13.8c3.2-2.4 5.8-3.2 8.5-3-8.4-10.6-14.7-24.2 1.6-40.6 4.6-4.6 10.2-6.8 15.9-7 .6-1.6 3.5-7.4 11.7-10.9 0 0 4.7 2.4 7.4 16.1 4.3 2.4 8.4 5.6 12.1 9.2 3.6 3.6 6.8 7.8 9.2 12.2 13.7 2.6 16.2 7.3 16.2 7.3-3.6 8.2-9.4 11.1-10.9 11.7-.3 5.8-2.4 11.4-7.1 16-16.4 16.4-30 9.9-40.6 1.5.2 2.8-.6 5.4-3 8.6l-13.8 13.8c-1.1 1.2.7 5.4.9 5.3Z"/>
      </svg>
    </a>
    <header class="app-header">
      <div>
        <p class="eyebrow">RoboMaster Spectator Console</p>
        <h1 id="eventTitle">赛事多视角监看系统</h1>
      </div>
      <div class="header-actions">
        <span class="version-pill">v1.4.0</span>
        <div class="status-pill" id="feedStatus" aria-live="polite">
          <span class="status-dot"></span>
          <span>准备加载</span>
        </div>
        <button class="icon-button text-button" id="refreshButton" type="button">
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="control-band" aria-label="直播控制">
        <label class="field">
          <span>赛区</span>
          <select id="zoneSelect"></select>
        </label>
        <label class="field search-field">
          <span>筛选视角</span>
          <input id="viewFilter" type="search" placeholder="英雄、工程、无人机、主视角">
        </label>
        <label class="field">
          <span>布局</span>
          <select id="layoutSelect"></select>
        </label>
        <label class="field">
          <span>大画面分辨率</span>
          <select id="mainResolutionSelect"></select>
        </label>
        <label class="field">
          <span>小窗策略</span>
          <select id="previewModeSelect"></select>
        </label>
        <label class="field">
          <span>注意力</span>
          <select id="focusSideSelect"></select>
        </label>
        <div class="control-actions">
          <button class="icon-button text-button" id="cleanModeButton" type="button" aria-pressed="false">
            <i data-lucide="monitor-up" aria-hidden="true"></i>
            <span>纯净</span>
          </button>
        </div>
        <div class="meta-row">
          <span id="lastUpdated">尚未更新</span>
          <span id="sourceCount">0 路信号</span>
        </div>
      </section>

      <section class="viewer-layout" id="viewerLayout">
        <article class="main-view" aria-label="主观看视角">
          <div id="mainGrid" class="main-grid"></div>
          <div id="mainEmpty" class="empty-state main-empty" hidden>
            <i data-lucide="radio" aria-hidden="true"></i>
            <p>等待直播源。</p>
          </div>
        </article>

        <aside id="sidePanel" class="side-panel" aria-label="视角列表">
          <div class="panel-heading">
            <h2 id="smallPanelTitle">可切换视角</h2>
            <span id="smallPanelHint">小窗优先低清</span>
          </div>
          <div id="thumbGrid" class="thumb-grid"></div>
          <div id="emptyState" class="empty-state" hidden>
            <i data-lucide="radio" aria-hidden="true"></i>
            <p>当前赛区还没有可用第一视角。</p>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
