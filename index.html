<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="RoboMaster 多视角直播监看工具">
    <title>RoboMaster Spectator Console</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="github-corner" href="https://github.com/ZhichuCen/RMSpectatorMode" target="_blank" rel="noreferrer" aria-label="前往 GitHub 仓库">
      <svg viewBox="0 0 98 96" aria-hidden="true" focusable="false">
        <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M49 0C21.9 0 0 22 0 49.1c0 21.7 14 40 33.5 46.5 2.5.5 3.4-1.1 3.4-2.4 0-1.2-.1-5.2-.1-9.4-13.6 3-16.5-5.8-16.5-5.8-2.2-5.7-5.5-7.2-5.5-7.2-4.5-3.1.3-3 .3-3 5 .3 7.6 5.1 7.6 5.1 4.4 7.5 11.5 5.3 14.3 4.1.4-3.2 1.7-5.3 3.1-6.5-10.9-1.2-22.3-5.4-22.3-24.2 0-5.4 1.9-9.8 5.1-13.2-.5-1.2-2.2-6.3.5-13 0 0 4.2-1.3 13.5 5 3.9-1.1 8.1-1.6 12.2-1.6 4.1 0 8.3.6 12.2 1.6 9.3-6.3 13.5-5 13.5-5 2.7 6.7 1 11.8.5 13 3.2 3.4 5.1 7.8 5.1 13.2 0 18.8-11.5 23-22.4 24.2 1.8 1.5 3.3 4.5 3.3 9.1 0 6.6-.1 11.9-.1 13.5 0 1.3.9 2.9 3.4 2.4C84 89 98 70.7 98 49.1 98 22 76.1 0 49 0Z"/>
      </svg>
    </a>
    <header class="app-header">
      <div>
        <p class="eyebrow">RoboMaster Spectator Console</p>
        <h1 id="eventTitle">赛事多视角监看系统</h1>
      </div>
      <div class="header-actions">
        <span class="version-pill">v1.2.1</span>
        <div class="status-pill" id="feedStatus" aria-live="polite">
          <span class="status-dot"></span>
          <span>准备加载</span>
        </div>
        <button class="icon-button text-button" id="refreshButton" type="button">
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="control-band" aria-label="直播控制">
        <label class="field">
          <span>赛区</span>
          <select id="zoneSelect"></select>
        </label>
        <label class="field search-field">
          <span>筛选视角</span>
          <input id="viewFilter" type="search" placeholder="英雄、工程、无人机、主视角">
        </label>
        <label class="field">
          <span>布局</span>
          <select id="layoutSelect"></select>
        </label>
        <label class="field">
          <span>大画面分辨率</span>
          <select id="mainResolutionSelect"></select>
        </label>
        <div class="meta-row">
          <span id="lastUpdated">尚未更新</span>
          <span id="sourceCount">0 路信号</span>
        </div>
      </section>

      <section class="viewer-layout" id="viewerLayout">
        <article class="main-view" aria-label="主观看视角">
          <div id="mainGrid" class="main-grid"></div>
          <div id="mainEmpty" class="empty-state main-empty" hidden>
            <i data-lucide="radio" aria-hidden="true"></i>
            <p>等待直播源。</p>
          </div>
        </article>

        <aside id="sidePanel" class="side-panel" aria-label="视角列表">
          <div class="panel-heading">
            <h2 id="smallPanelTitle">可切换视角</h2>
            <span id="smallPanelHint">小窗优先低清</span>
          </div>
          <div id="thumbGrid" class="thumb-grid"></div>
          <div id="emptyState" class="empty-state" hidden>
            <i data-lucide="radio" aria-hidden="true"></i>
            <p>当前赛区还没有可用第一视角。</p>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
